name: Build & Package luci-app-singsing

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build LuCI engine bundle
        run: npm run build

      - name: Run unit and sing-box 1.14.3 schema tests
        run: npm test

      - name: Execute sing-box 1.14.4 on generated configs
        run: |
          archive="sing-box-1.14.4-linux-amd64"
          mkdir -p "$RUNNER_TEMP/sing-box"
          curl -fsSL --retry 3 "https://github.com/SagerNet/sing-box/releases/download/v1.14.4/$archive.tar.gz" -o "$RUNNER_TEMP/sing-box/core.tar.gz"
          echo "699a1b510aa4396b2176d32d1181920399ebf1e267835da6f3b598d0f7c24968  $RUNNER_TEMP/sing-box/core.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/sing-box/core.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/sing-box"
          SINGSING_SING_BOX="$RUNNER_TEMP/sing-box/sing-box" npm run test:sing-box

      - name: Verify shell, JSON, and LuCI JS syntax
        run: |
          sh -n root/usr/share/singsing/service-manager.sh
          sh -n root/etc/init.d/singsing
          sh -n root/etc/hotplug.d/iface/95-singsing
          sh -n root/etc/uci-defaults/99-singsing
          node -e '
            const fs = require("fs");
            for (const f of [
              "root/usr/share/luci/menu.d/luci-app-singsing.json",
              "root/usr/share/rpcd/acl.d/luci-app-singsing.json",
              "root/etc/capabilities/singsing.json"
            ]) {
              JSON.parse(fs.readFileSync(f, "utf8"));
            }
            const jsFiles = [
              "htdocs/luci-static/resources/singsing/api.js",
              ...fs.readdirSync("htdocs/luci-static/resources/view/singsing")
                .map(f => "htdocs/luci-static/resources/view/singsing/" + f)
            ];
            for (const f of jsFiles) {
              new Function(fs.readFileSync(f, "utf8"));
            }
            console.log("All JSON and LuCI JS files valid:", jsFiles.length);
          '

      - name: Upload built engine bundle
        uses: actions/upload-artifact@v4
        with:
          name: engine-bundle
          path: |
            htdocs/luci-static/resources/singsing/engine-bundle.js
            htdocs/luci-static/resources/singsing/api.js

  package-openwrt:
    needs: test-and-verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: openwrt-24.10-ipk
            base_url: https://downloads.openwrt.org/releases/24.10.8/targets/x86/64
            sdk: openwrt-sdk-24.10.8-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            sha256: ac4a0405d2eea821b06f93c14ba13ffa90ad0457648903df7dde02570027ab21
            ext: ipk
          - name: openwrt-25.12-apk
            base_url: https://downloads.openwrt.org/releases/25.12.6/targets/x86/64
            sdk: openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sha256: 1864152619092e781fa36a401960c8e9ae42d6a364c44ee5f0b197ca5f3c0fcc
            ext: apk
    steps:
      - uses: actions/checkout@v4

      - name: Download built engine bundle
        uses: actions/download-artifact@v4
        with:
          name: engine-bundle
          path: htdocs/luci-static/resources/singsing

      - name: Install build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd rsync file gawk unzip git build-essential

      - name: Download and extract OpenWrt SDK
        run: |
          mkdir -p /tmp/sdk
          curl -fsSL --retry 3 "${{ matrix.base_url }}/${{ matrix.sdk }}" -o /tmp/openwrt-sdk.tar.zst
          echo "${{ matrix.sha256 }}  /tmp/openwrt-sdk.tar.zst" | sha256sum --check
          tar --zstd -xf /tmp/openwrt-sdk.tar.zst --strip-components=1 -C /tmp/sdk
          rm /tmp/openwrt-sdk.tar.zst

      - name: Prepare feeds and package source
        run: |
          cd /tmp/sdk
          ./scripts/feeds update luci
          mkdir -p package/luci-app-singsing
          rsync -a --no-owner --no-group \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='src' \
            --exclude='scripts' \
            "${{ github.workspace }}/" package/luci-app-singsing/

      - name: Compile luci-app-singsing
        run: |
          cd /tmp/sdk
          make defconfig
          # Export SDK host staging paths and SDK tar so fakeroot intercepts stat() on Ubuntu 24.04
          # and all IPK/APK archive entries record 0:0 (root:root) ownership.
          export STAGING_DIR_HOST="$PWD/staging_dir/host"
          export PATH="$STAGING_DIR_HOST/bin:$PATH"
          if [ -x "$STAGING_DIR_HOST/bin/tar" ]; then
            export TAR="$STAGING_DIR_HOST/bin/tar"
          fi
          # Package the checked JS and scripts using the SDK without rebuilding runtime dependencies.
          make -C package/luci-app-singsing TOPDIR="$PWD" CONFIG_LUCI_JSMIN= V=s compile
          mkdir -p "${{ github.workspace }}/release-artifacts"
          find bin/packages -type f -name 'luci-app-singsing*.${{ matrix.ext }}' \
            -exec cp -v {} "${{ github.workspace }}/release-artifacts/" \;
          ls -lh "${{ github.workspace }}/release-artifacts/"

      - name: Verify package dependencies, hooks and payload
        run: |
          for artifact in release-artifacts/*.${{ matrix.ext }}; do
            sh scripts/verify-openwrt-package.sh "$artifact" /tmp/sdk/staging_dir/host/bin/apk
          done

      - name: Upload OpenWrt package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release-artifacts/*.${{ matrix.ext }}
          if-no-files-found: error

  release:
    needs: package-openwrt
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate SHA256SUMS
        run: |
          mkdir -p release-files
          find dist -type f \( -name '*.ipk' -o -name '*.apk' \) -exec cp {} release-files/ \;
          (cd release-files && sha256sum *.ipk *.apk > SHA256SUMS)
          cat release-files/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-files/*.ipk
            release-files/*.apk
            release-files/SHA256SUMS
